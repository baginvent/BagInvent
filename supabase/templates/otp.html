<html>
<body style="font-family: Arial, sans-serif; padding: 20px; background-color: #f5f5f5;">
  <div style="max-width: 460px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 40px; text-align: center;">
    <h2 style="color: #1a1a1a; margin-bottom: 8px;">Verification Code</h2>
    <p style="color: #666; margin-bottom: 24px;">Enter this code to sign in to your account:</p>
    <div style="font-size: 32px; font-weight: bold; letter-spacing: 8px; color: #1a1a1a; background: #f0f0f0; padding: 16px; border-radius: 8px; display: inline-block;">
      {{ .Token }}
    </div>
    <p style="color: #999; margin-top: 24px; font-size: 13px;">This code expires in 5 minutes. If you didn't request it, you can safely ignore this email.</p>
  </div>
</body>
</html>
